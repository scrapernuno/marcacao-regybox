name: Marcacao Automatica RegyBox

on:
  schedule:
    # Executa de Segunda a Sexta às 18:24 (Hora de Portugal = 17:24 UTC)
    - cron: '24 17 * * 1-5'
  workflow_dispatch: # Permite testar manualmente no site do GitHub

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Executar Robô de Marcação
        env:
          REGYBOX_USER: ${{ secrets.REGYBOX_USER }}
          REGYBOX_PASS: ${{ secrets.REGYBOX_PASS }}
        run: python marcar_aula.py
