name: Marcacao RegyBox

on:
  schedule:
    # 17:34 UTC = 18:34 Madeira (ajuste se necessário)
    - cron: '19 17 * * 1-5'
  workflow_dispatch:

jobs:
  marcar:
    runs-on: ubuntu-latest

    env:
      TZ: Atlantic/Madeira
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 urllib3

      - name: Instalar Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Script
        id: marcacao
        continue-on-error: true
        env:
          REGYBOX_USER: ${{ secrets.REGYBOX_USER }}
          REGYBOX_PASS: ${{ secrets.REGYBOX_PASS }}

          # SMTP
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: "587"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}

          # Destinatário
          EMAIL_TO: nuno.mendes.freitas@gmail.com

        run: |
          python marcar_aula.py

      - name: Guardar Diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regybox-diagnostico-${{ github.run_number }}
          path: diagnostico_regybox/
          if-no-files-found: warn
          retention-days: 7

      - name: Verificar Resultado
        if: always()
        run: |
          if [ "${{ steps.marcacao.outcome }}" = "success" ]; then
            echo "✅ Marcação concluída com sucesso."
          else
            echo "❌ A marcação falhou."
            echo "Consulte o artefacto regybox-diagnostico-${{ github.run_number }}."
            exit 1
          fi
