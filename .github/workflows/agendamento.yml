name: Marcacao RegyBox

on:
  schedule:
    - cron: '34 17 * * 1-5'
  workflow_dispatch:

jobs:
  marcar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Instalar Navegador Chromium do Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Script de Marcação
        env:
          REGYBOX_USER: ${{ secrets.REGYBOX_USER }}
          REGYBOX_PASS: ${{ secrets.REGYBOX_PASS }}
        run: |
          python marcar_aula.py

      - name: Guardar Diagnóstico RegyBox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regybox-diagnostico-${{ github.run_number }}
          path: diagnostico_regybox/
          if-no-files-found: warn
          retention-days: 7
