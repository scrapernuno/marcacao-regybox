      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests beautifulsoup4 urllib3

      - name: Instalar Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Executar Script de Marcação
        id: marcacao
        continue-on-error: true
        env:
          REGYBOX_USER: ${{ secrets.REGYBOX_USER }}
          REGYBOX_PASS: ${{ secrets.REGYBOX_PASS }}
        run: |
          python marcar_aula.py
