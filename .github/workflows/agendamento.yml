name: Marcacao RegyBox

on:
  schedule:
    # Corre às 18:34 WEST (17:34 UTC) de Segunda a Sexta
    - cron: '34 17 * * 1-5'
  workflow_dispatch: # Permite correr manualmente no separador Actions

jobs:
  marcar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Instalar Navegador Chromium do Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Script de Marcação
        env:
          REGYBOX_USER: ${{ secrets.REGYBOX_USER }}
          REGYBOX_PASS: ${{ secrets.REGYBOX_PASS }}
        run: |
          python marcar_aula.py
