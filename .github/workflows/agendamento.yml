name: Marcacao RegyBox

on:
  schedule:
    # Horário de verão: 17:19 UTC = 18:19 na Madeira
    - cron: "19 17 * * 1-5"
  workflow_dispatch:

jobs:
  marcar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Atlantic/Madeira
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests beautifulsoup4 urllib3

      - name: Instalar Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Criar Pasta de Diagnóstico
        run: |
          mkdir -p diagnostico_regybox

      - name: Executar Script
        id: marcacao
        continue-on-error: true
        env:
          REGYBOX_USER: ${{ secrets.REGYBOX_USER }}
          REGYBOX_PASS: ${{ secrets.REGYBOX_PASS }}
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: "587"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: nuno.mendes.freitas@gmail.com
        run: |
          echo "Hora UTC: $(date -u '+%d/%m/%Y %H:%M:%S')"
          echo "Hora Madeira: $(TZ=Atlantic/Madeira date '+%d/%m/%Y %H:%M:%S %Z')"
          python run_regybox.py

      - name: Guardar Diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regybox-diagnostico-${{ github.run_number }}
          path: diagnostico_regybox/
          if-no-files-found: warn
          retention-days: 14

      - name: Verificar Resultado
        if: always()
        run: |
          if [ "${{ steps.marcacao.outcome }}" = "success" ]; then
            echo "✅ Marcação concluída com sucesso."
            exit 0
          fi

          echo "::error::A marcação falhou."
          echo "::error::Consulte o artefacto regybox-diagnostico-${{ github.run_number }}."
          exit 1
